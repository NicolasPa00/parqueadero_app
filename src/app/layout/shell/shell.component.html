<app-sidebar />

<div class="main-area">
  <header class="topbar">
    <div class="topbar__left">
      <h1 class="topbar__title">{{ pageTitle() }}</h1>
      <span class="topbar__date">{{ fechaActual() }}</span>
    </div>

    <div class="topbar__right">
      @if (authService.usuario(); as u) {
        <div class="user-chip" aria-label="Sesión activa">
          <span class="user-chip__avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user-chip__name">{{ u.nombre_completo }}</span>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span class="footer__brand">EscalApp</span>
    <span class="footer__copy">&copy; {{ currentYear }} Todos los derechos reservados</span>
  </footer>
</div>

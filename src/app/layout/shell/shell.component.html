<app-sidebar />

<div class="main-area">
  <header class="topbar">
    <div class="topbar__left">
      <h1 class="topbar__title">{{ pageTitle() }}</h1>
      <span class="topbar__date">{{ fechaActual() }}</span>
    </div>

    <div class="topbar__right">
      <button class="topbar__btn" (click)="themeService.toggleTheme()" aria-label="Cambiar tema">
        <lucide-icon [name]="themeService.resolvedTheme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
      <span class="topbar__user">{{ authService.usuario()?.nombre_completo ?? '' }}</span>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span class="footer__brand">EscalApp</span>
    <span class="footer__copy">&copy; {{ currentYear }} Todos los derechos reservados</span>
  </footer>
</div>
